[package]
name = "cviz"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["Connor Faulkner <connorjfaulkner@gmail.com>"]
description = "2.5D codebase visualizer"
license = "MIT"

[dependencies]
wgpu = "28"
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
git2 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
